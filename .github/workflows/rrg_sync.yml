# .github/workflows/rrg_sync.yml
#
# Runs every Friday at 5:08 PM IST = 11:38 UTC Friday.
# Offset 15 minutes from the weekly_sync workflow to avoid runner contention.
#
# Split out from weekly_sync.yml because the RRG pipeline is fully independent
# of the Stage Analysis and Weekly Watchlist pipelines (no shared DB tables,
# no ordering dependency), and running all three sequentially was exceeding
# the 1-hour timeout.
#
# Scheduling note (measured 2026-09-08 → 2026-09-18): GitHub's hosted scheduler
# delivered EVERY workflow in this repo 3h40m–5h40m after its nominal cron, and
# dropped most firings of the high-frequency ones. Runs on :00 and :30 sit in the
# most congested slots, so every cron here now uses an off-peak minute. That is a
# mitigation, not a cure — treat the nominal time as "no earlier than", and keep
# the scripts' own clock guards wide enough to stay useful when a run lands late.

name: RRG Sync (Friday 5:08 PM IST)

on:
  schedule:
    - cron: '38 11 * * 5'   # 11:38 UTC Friday = 5:08 PM IST Friday
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  rrg-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
      BENCHMARK_TICKER:          NIFTY
      BENCHMARK_EXCHANGE:        NSE
      STOCK_EXCHANGE:            NSE
      LOOKBACK_PERIODS:          150
      TAIL_PERIODS:              12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rrg_pipeline_w.py
        run: python scripts/rrg_pipeline_w.py
        continue-on-error: true

      - name: Send Telegram summary
        if: always()
        run: |
          python - <<'EOF'
          import json, pathlib
          from notify import send_telegram

          path = pathlib.Path("results/rrg.json")
          if not path.exists():
              send_telegram("❌ <b>RRG Pipeline (Weekly)</b> — crashed before writing result\n")
          else:
              try:
                  r = json.loads(path.read_text())
                  if not isinstance(r, dict):
                      raise ValueError("result file is not a JSON object")
              except Exception as exc:
                  send_telegram(f"❌ <b>RRG Pipeline (Weekly)</b> — unreadable result file ({exc})\n")
                  raise SystemExit(0)

              failed = r.get("failed", 0)
              icon = "✅" if failed == 0 else "⚠️"
              lines = [
                  f"{icon} <b>{r.get('script', 'RRG Pipeline (Weekly)')}</b>\n",
                  f"   ✔ {r.get('succeeded', '?')} succeeded  "
                  f"✖ {failed} failed  "
                  f"⏭ {r.get('skipped', '?')} skipped",
              ]
              if r.get("errors"):
                  tickers = ", ".join(str(e) for e in r["errors"])
                  lines.append(f"   <code>{tickers}</code>")
              send_telegram("\n".join(lines))
          EOF
