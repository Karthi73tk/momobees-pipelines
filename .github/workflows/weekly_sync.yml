# .github/workflows/weekly_sync.yml
#
# Runs every Friday at 4:53 PM IST = 11:23 UTC Friday.
# IST is UTC+5:30, so 16:53 IST = 11:23 UTC.
#
# Each script writes results/SCRIPT.json with succeeded/failed/skipped counts.
# The final step reads the result files and sends one consolidated Telegram message.
#
# Scheduling note (measured 2026-09-08 → 2026-09-18): GitHub's hosted scheduler
# delivered EVERY workflow in this repo 3h40m–5h40m after its nominal cron, and
# dropped most firings of the high-frequency ones. Runs on :00 and :30 sit in the
# most congested slots, so every cron here now uses an off-peak minute. That is a
# mitigation, not a cure — treat the nominal time as "no earlier than", and keep
# the scripts' own clock guards wide enough to stay useful when a run lands late.

name: Weekly Sync (Friday 4:53 PM IST)

on:
  schedule:
    - cron: '23 11 * * 5'   # 11:23 UTC Friday = 4:53 PM IST Friday
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  weekly-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
      BENCHMARK_TICKER:          NIFTY
      BENCHMARK_EXCHANGE:        NSE
      STOCK_EXCHANGE:            NSE
      LOOKBACK_PERIODS:          150
      TAIL_PERIODS:              12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Step 1: Stage Analysis ─────────────────────────────────────────────
      - name: Run stage_analysis_pipeline_w.py
        run: python scripts/swing_professor/stage_analysis_pipeline_w.py
        continue-on-error: true

      # ── Step 2: Weekly Watchlist Pipeline (Swing Professor) ─────────────────
      # Must run after Step 1: it only reads stage.weekly_stock_stages, never
      # writes it, and works off stale data if the stage classifier hasn't
      # refreshed it yet this week (see The_Professor/Docs/HANDOFF.md §2).
      - name: Run weekly_watchlist_pipeline.py
        run: python scripts/swing_professor/weekly_watchlist_pipeline.py --store-backend supabase --reports-dir reports
        continue-on-error: true

      # ── Send one consolidated Telegram summary ─────────────────────────────
      # Note: RRG pipeline runs in its own workflow (rrg_sync.yml) to stay
      # within the 1-hour timeout.
      - name: Send Telegram summary
        if: always()
        run: |
          python - <<'EOF'
          import json, pathlib
          from notify import send_telegram

          result_files = [
              ("results/stage.json",        "Stage Analysis (Weekly)"),
          ]

          lines = ["📅 <b>Weekly Sync Summary</b>\n"]

          for path, fallback_name in result_files:
              p = pathlib.Path(path)
              if not p.exists():
                  lines.append(f"❌ <b>{fallback_name}</b> — crashed before writing result\n")
                  continue

              try:
                  r = json.loads(p.read_text())
                  if not isinstance(r, dict):
                      raise ValueError("result file is not a JSON object")
              except Exception as exc:
                  lines.append(f"❌ <b>{fallback_name}</b> — unreadable result file ({exc})\n")
                  continue

              failed = r.get("failed", 0)
              icon = "✅" if failed == 0 else "⚠️"
              lines.append(
                  f"{icon} <b>{r.get('script', fallback_name)}</b>\n"
                  f"   ✔ {r.get('succeeded', '?')} succeeded  "
                  f"✖ {failed} failed  "
                  f"⏭ {r.get('skipped', '?')} skipped"
              )
              if r.get("errors"):
                  tickers = ", ".join(str(e) for e in r["errors"])
                  lines.append(f"   <code>{tickers}</code>")
              lines.append("")

          send_telegram("\n".join(lines))
          EOF
