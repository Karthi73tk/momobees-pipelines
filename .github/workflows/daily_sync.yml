# .github/workflows/daily_sync.yml
#
# Runs Mon–Fri at 4:23 PM IST = 10:53 UTC (after the 15:30 IST close).
#
# Each script writes results/SCRIPT.json with succeeded/failed/skipped counts.
# The final step reads all result files and sends one consolidated Telegram message.
#
# Scheduling note (measured 2026-09-08 → 2026-09-18): GitHub's hosted scheduler
# delivered EVERY workflow in this repo 3h40m–5h40m after its nominal cron, and
# dropped most firings of the high-frequency ones. Runs on :00 and :30 sit in the
# most congested slots, so every cron here now uses an off-peak minute. That is a
# mitigation, not a cure — treat the nominal time as "no earlier than", and keep
# the scripts' own clock guards wide enough to stay useful when a run lands late.

name: Daily Sync (Mon–Fri 4:23 PM IST)

on:
  schedule:
    - cron: '53 10 * * 1-5'   # 10:53 UTC Mon-Fri = 4:23 PM IST Mon-Fri
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
      BENCHMARK_TICKER:          NIFTY
      BENCHMARK_EXCHANGE:        NSE
      STOCK_EXCHANGE:            NSE
      LOOKBACK_PERIODS:          150
      TAIL_PERIODS:              12
      # pivot_analysis uses these legacy var names
      SUPABASE_URL:              ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Step 1: NSE All Universe Sync ──────────────────────────────────────
      - name: Run data_sync_engine_nse_all_d.py
        run: python scripts/data_sync_engine_nse_all_d.py
        continue-on-error: true

      # ── Step 1b: Blue Sky Breakout Screener → bluesky.daily_candidates ─────
      - name: Run bluesky_screener_d.py
        run: python scripts/bluesky_screener_d.py
        continue-on-error: true

      # ── Step 1c: Blue Sky virtual portfolio runner (2 variants, EOD) ──────
      - name: Run bluesky_portfolio_runner_d.py
        run: python scripts/bluesky_portfolio_runner_d.py
        continue-on-error: true

      # ── Step 1d: 13/34 SAR (NIFTY 75-min) — EOD forward-test book ──────
      - name: Run sar_pipeline.py (EOD)
        run: python scripts/sar_pipeline.py --eod
        continue-on-error: true

      # ── Step 2: Universe Sync (N750 tiers + F&O tags) ─────────────────────
      - name: Run sync_universe.py
        run: python scripts/sync_universe.py
        continue-on-error: true

      # ── Step 3: N750 Data Sync ─────────────────────────────────────────────
      - name: Run data_sync_engine_n750_d.py
        run: python scripts/data_sync_engine_n750_d.py
        continue-on-error: true

      # ── Step 3b: Market Indices Data Sync ──────────────────────────────────
      - name: Run data_sync_engine_indices.py
        run: python scripts/data_sync_engine_indices.py
        continue-on-error: true

      # ── Step 3c: Index Monthly Returns Sync ────────────────────────────────
      - name: Run sync_index_monthly_returns.py
        run: python scripts/sync_index_monthly_returns.py
        continue-on-error: true

      # ── Step 4: Market Pulse Global ────────────────────────────────────────
      - name: Run market_pulse_global_d.py
        run: python scripts/market_pulse_global_d.py
        continue-on-error: true

      # ── Step 5: Pivot Analysis ─────────────────────────────────────────────
      - name: Run pivot_analysis_d.py
        run: python scripts/pivot_analysis_d.py
        continue-on-error: true

      # ── Step 6: Momentum Scanner (N750) ────────────────────────────────────
      - name: Run momentum_scanner.py
        run: python scripts/momentum_scanner.py
        continue-on-error: true

      # ── Step 6b: Weekly Momentum Scanner (N500) ────────────────────────────
      - name: Run momentum_weekly_scanner.py
        run: python scripts/momentum_weekly_scanner.py
        continue-on-error: true

      # ── Step 7: Portfolio Rebalance ────────────────────────────────────────
      - name: Run portfolio_rebalance_d.py
        run: python scripts/portfolio_rebalance_d.py
        continue-on-error: true

      # ── Step 8: Portfolio NAV Snapshot ─────────────────────────────────────
      - name: Run portfolio_nav_snapshot_d.py
        run: python scripts/portfolio_nav_snapshot_d.py
        continue-on-error: true

      # ── Step 9: Model Portfolio Runner ──────────────────────────────────────
      # continue-on-error is required, not cosmetic: the script calls sys.exit(1)
      # whenever failed > 0, and it deliberately sets failed = 1 for the GOLDBEES
      # URGENT_ALERT case — an alert, not a crash. Without this, that alert (or any
      # single ticker failure) aborts the job and silently skips Step 10 below.
      - name: Run model_portfolio_runner_d.py
        run: python scripts/model_portfolio_runner_d.py
        continue-on-error: true

      # ── Step 10: Swing Professor Daily RVOL Scan ────────────────────────────
      # Independent of the steps above -- scoped only to tickers already
      # ACTIVE on swing_professor.watchlist (not the full NSE universe), so
      # it doesn't depend on today's universe/momentum syncs having run first.
      - name: Run daily_rvol_scanner.py
        run: python scripts/swing_professor/daily_rvol_scanner.py
        continue-on-error: true

      # ── Send one consolidated Telegram summary ─────────────────────────────
      - name: Send Telegram summary
        if: always()
        run: |
          python - <<'EOF'
          import json, pathlib
          from notify import send_telegram

          result_files = [
              ("results/nse_all.json",             "NSE All Universe Sync"),
              ("results/bluesky.json",             "Blue Sky Screener"),
              ("results/bluesky_portfolio.json",   "Blue Sky Portfolio"),
              ("results/sar.json",             "SAR (NIFTY 75m)"),
              ("results/universe_sync.json",       "Universe Sync (N750 tiers)"),
              ("results/n750.json",                "N750 Data Sync"),
              ("results/indices.json",             "Indices Data Sync"),
              ("results/index_monthly_returns.json", "Index Monthly Returns Sync"),
              ("results/market_pulse.json",        "Market Pulse Global"),
              ("results/pivot.json",               "Pivot Analysis"),
              ("results/momentum.json",            "Momentum Scanner (N750)"),
              ("results/momentum_weekly.json",     "Weekly Momentum Scanner (N500)"),
              ("results/portfolio_rebalance.json", "Portfolio Rebalance"),
              ("results/portfolio_nav.json",       "Portfolio NAV Snapshot"),
              ("results/model_portfolio.json",     "Model Portfolio Runner (ST2)"),
          ]

          lines = ["🗓 <b>Daily Sync Summary</b>\n"]

          # Parse each result file defensively. A truncated write or a missing
          # key used to raise out of this whole step, which meant ONE bad file
          # suppressed the entire summary — the only observability this job has.
          for path, fallback_name in result_files:
              p = pathlib.Path(path)
              if not p.exists():
                  lines.append(f"❌ <b>{fallback_name}</b> — crashed before writing result\n")
                  continue

              try:
                  r = json.loads(p.read_text())
                  if not isinstance(r, dict):
                      raise ValueError("result file is not a JSON object")
              except Exception as exc:
                  lines.append(f"❌ <b>{fallback_name}</b> — unreadable result file ({exc})\n")
                  continue

              failed = r.get("failed", 0)
              icon = "✅" if failed == 0 else "⚠️"
              lines.append(
                  f"{icon} <b>{r.get('script', fallback_name)}</b>\n"
                  f"   ✔ {r.get('succeeded', '?')} succeeded  "
                  f"✖ {failed} failed  "
                  f"⏭ {r.get('skipped', '?')} skipped"
              )
              if r.get("errors"):
                  tickers = ", ".join(str(e) for e in r["errors"])
                  lines.append(f"   <code>{tickers}</code>")
              lines.append("")

          send_telegram("\n".join(lines))
          EOF
