# .github/workflows/bluesky_intraday.yml
#
# Blue Sky intraday poller — live tvDatafeed quotes to check stops and fill
# intraday breakouts on the two virtual books, BETWEEN the EOD jobs.
#
# Runs every 30 min during NSE market hours. The script guards on the clock
# (acts only 09:15–15:35 IST), and every firing below now lands inside that
# window — the previous '*/30 3-10' started at 08:30 IST, not 09:00 as its
# comment claimed, so two runs a day were guaranteed no-ops.
#
# Scheduling note (measured 2026-09-08 → 2026-09-18): GitHub's hosted scheduler
# delivered EVERY workflow in this repo 3h40m–5h40m after its nominal cron, and
# dropped most firings of the high-frequency ones. Runs on :00 and :30 sit in the
# most congested slots, so every cron here now uses an off-peak minute. That is a
# mitigation, not a cure — treat the nominal time as "no earlier than", and keep
# the scripts' own clock guards wide enough to stay useful when a run lands late.

name: Blue Sky Intraday (every 30 min, market hours)

on:
  schedule:
    - cron: '13,43 4-9 * * 1-5'   # 09:43–15:13 IST, Mon–Fri (UTC 04:13–09:43)
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bluesky_intraday_poller.py
        run: python scripts/bluesky_intraday_poller.py
